name: AgentRemote secret-free Windows preflight

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: Reviewed public candidate ZIP URL
        required: true
        type: string
      package_sha256:
        description: Reviewed candidate SHA256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentremote-preflight-windows
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Start the same controller without credentials
        shell: pwsh
        env:
          AR_PACKAGE_URL: ${{ inputs.package_url }}
          AR_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: .github/scripts/agentremote-ci-controller.ps1 -Mode Start -Preflight
      - name: Verify cross-step identity and release the preflight
        shell: pwsh
        run: .github/scripts/agentremote-ci-controller.ps1 -Mode WaitFinal -Preflight
      - name: Stop only the owned preflight controller
        if: always()
        shell: pwsh
        run: .github/scripts/agentremote-ci-controller.ps1 -Mode Stop -Preflight
      - name: Upload only the sanitized preflight report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agentremote-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/final.json
          if-no-files-found: error
          retention-days: 7
